name: ML background pipeline - daily

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate required GitHub Actions secrets
        env:
          DB_PATH: ${{ secrets.DB_PATH }}
          FOOTBALL_PROVIDER: ${{ secrets.FOOTBALL_PROVIDER }}
          FOOTBALL_PROVIDER_CHAIN: ${{ secrets.FOOTBALL_PROVIDER_CHAIN }}
          FOOTBALL_PROVIDER_MODE: ${{ secrets.FOOTBALL_PROVIDER_MODE }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BIGBALLSDATA_API_KEY: ${{ secrets.BIGBALLSDATA_API_KEY }}
          ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          missing=0
          for name in DB_PATH FOOTBALL_PROVIDER FOOTBALL_PROVIDER_CHAIN FOOTBALL_PROVIDER_MODE API_FOOTBALL_KEY API_FOOTBALL_KEYS FOOTBALL_DATA_API_KEY BSD_API_KEY BIGBALLSDATA_API_KEY ALLSPORTSAPI_API_KEY ISPORTS_API_KEY THESPORTSDB_API_KEY GROQ_API_KEY GROQ_MODEL GEMINI_API_KEY GEMINI_MODEL; do
            if [ -z "${!name}" ]; then
              echo "::warning::GitHub Actions secret $name is not set."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required GitHub Actions secrets are missing. Add the missing names under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Run daily data, prediction, monitoring and AI gate
        env:
          PYTHONPATH: ${{ github.workspace }}
          DB_PATH: ${{ secrets.DB_PATH }}
          FOOTBALL_PROVIDER: ${{ secrets.FOOTBALL_PROVIDER }}
          FOOTBALL_PROVIDER_CHAIN: ${{ secrets.FOOTBALL_PROVIDER_CHAIN }}
          FOOTBALL_PROVIDER_MODE: ${{ secrets.FOOTBALL_PROVIDER_MODE }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BIGBALLSDATA_API_KEY: ${{ secrets.BIGBALLSDATA_API_KEY }}
          ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: python scripts/run_ml_pipeline.py --mode daily
