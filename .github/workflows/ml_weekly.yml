name: ML background pipeline - weekly retrain

on:
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml-weekly
  cancel-in-progress: true

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate background ML configuration
        env:
          PYTHONPATH: ${{ github.workspace }}
          DB_PATH: ${{ secrets.DB_PATH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$DB_PATH" || { echo "::error::DB_PATH GitHub secret is missing."; exit 1; }
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "::error::No Gemini or Groq AI key is configured for the background publication gate."
            exit 1
          fi

      - name: Retrain, evaluate, monitor and AI-review future predictions
        env:
          PYTHONPATH: ${{ github.workspace }}
          DB_PATH: ${{ secrets.DB_PATH }}
          # Weekly retraining uses the same bounded OpenFootball history source
          # so a slow/rate-limited provider cannot hold the ML job open.
          FOOTBALL_PROVIDER: "bsd,bigballsdata,thesportsdb,openfootball,api-football,football-data"
          FOOTBALL_PROVIDER_CHAIN: "bsd,bigballsdata,thesportsdb,openfootball,api-football,football-data"
          FOOTBALL_PROVIDER_MODE: "merge"
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BIGBALLSDATA_API_KEY: ${{ secrets.BIGBALLSDATA_API_KEY }}
          ALLSPORTSAPI_API_KEY: ${{ secrets.ALLSPORTSAPI_API_KEY }}
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        timeout-minutes: 10
        run: python scripts/run_ml_pipeline.py --mode weekly
      - name: Publish canonical ML manifest
        if: success()
        env:
          PYTHONPATH: ${{ github.workspace }}
          DB_PATH: ${{ secrets.DB_PATH }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A normal git push can race with code/config commits made while
          # the ML job is running. Retry from the latest main revision so
          # the generated manifest is not lost to a non-fast-forward.
          for attempt in 1 2 3 4 5; do
            echo "Publishing ML manifest (attempt $attempt/5)..."
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_ml_manifest.py
            git add data/latest_ml_manifest.json
            if git diff --cached --quiet; then
              echo "Manifest unchanged."
              exit 0
            fi
            git commit -m "Publish latest approved ML manifest [skip ci]"
            if git push origin HEAD:main; then
              echo "Manifest published successfully."
              exit 0
            fi
            echo "Push raced with another update; retrying from latest main."
            git reset --hard origin/main
            sleep 2
          done
          echo "::error::Could not publish ML manifest after 5 attempts."
          exit 1
